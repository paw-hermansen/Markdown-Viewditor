name: Release Snap

on:
  workflow_call:
    inputs:
      tag:
        description: "Tag name to build (e.g. v1.3.0)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build Snap (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            artifact: debs-linux
          - arch: arm64
            artifact: debs-linux-arm64

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download deb from release
        uses: actions/download-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: src-tauri/target/release/bundle/deb/

      - name: Install Snapcraft and required snaps
        run: |
          sudo snap wait system seed.loaded
          sudo snap install core22
          sudo snap install gnome-42-2204
          sudo snap install gtk-common-themes
          sudo snap install snapcraft --classic

      - name: Build Snap
        run: snapcraft pack --destructive-mode

      - name: Upload Snap artifact
        uses: actions/upload-artifact@v5
        with:
          name: snap-${{ matrix.arch }}
          path: ./*.snap
          if-no-files-found: error

  publish:
    name: Publish to Snap Store
    needs: build
    runs-on: ubuntu-latest
    environment: snap-store

    steps:
      - name: Download amd64 snap
        uses: actions/download-artifact@v5
        with:
          name: snap-amd64
          path: snaps/

      - name: Download arm64 snap
        uses: actions/download-artifact@v5
        with:
          name: snap-arm64
          path: snaps/

      - name: Install Snapcraft
        run: sudo snap install snapcraft --classic

      - name: Publish to Snap Store
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          for snap in snaps/*.snap; do
            snapcraft upload --release=stable "$snap"
          done
