name: Release Snap

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: "Tag name to build (e.g. v1.3.0)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build Snap (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build deb
        run: npm run tauri build -- --bundles deb

      - name: Install Snapcraft
        run: sudo snap install snapcraft --classic

      - name: Build Snap
        run: snapcraft --destructive-mode

      - name: Upload Snap artifact
        uses: actions/upload-artifact@v5
        with:
          name: snap-${{ matrix.arch }}
          path: ./*.snap
          if-no-files-found: error

  publish:
    name: Publish to Snap Store
    needs: build
    runs-on: ubuntu-latest
    environment: snap-store

    steps:
      - name: Download amd64 snap
        uses: actions/download-artifact@v5
        with:
          name: snap-amd64
          path: snaps/

      - name: Download arm64 snap
        uses: actions/download-artifact@v5
        with:
          name: snap-arm64
          path: snaps/

      - name: Install Snapcraft
        run: sudo snap install snapcraft --classic

      - name: Publish to Snap Store
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          for snap in snaps/*.snap; do
            snapcraft upload --release=stable "$snap"
          done
