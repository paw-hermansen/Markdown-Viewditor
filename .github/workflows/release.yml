name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name to build (must already exist, e.g. v0.1.0)"
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: "Tag name to build (e.g. v0.1.0)"
        required: true
        type: string
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: true
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build & Release (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-22.04
            args: ""
          - platform: linux-arm64
            runner: ubuntu-22.04-arm
            args: ""
          - platform: windows
            runner: windows-latest
            args: ""
          - platform: macos
            runner: macos-latest
            args: "--target universal-apple-darwin"

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Linux system dependencies
        if: startsWith(matrix.platform, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Add Rust targets for macOS universal build
        if: matrix.platform == 'macos'
        run: rustup target add x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Resolve tag name
        id: tag
        shell: bash
        run: echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "true"
        with:
          tagName: ${{ steps.tag.outputs.name }}
          releaseName: "MarkdownViewditor ${{ steps.tag.outputs.name }}"
          releaseBody: "See [CHANGELOG.md](https://github.com/paw-hermansen/Markdown-Viewditor/blob/main/CHANGELOG.md) for release notes."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload deb artifacts
        if: startsWith(matrix.platform, 'linux')
        uses: actions/upload-artifact@v5
        with:
          name: debs-${{ matrix.platform }}
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
