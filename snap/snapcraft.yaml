name: markdown-viewditor
base: core22
version: "1.4.4"
summary: Markdown viewer and editor with advanced features and styled exports
description: |
  Markdown Viewditor is a markdown viewer and editor with scroll sync, custom themes, math (KaTeX) and chemical formulas, `SKILL.md` handling, and exports to several formats. It has three view modes: editor-only, split view, or preview-only.

  8 built-in dark and light themes, or create your own with custom CSS. Export your work to self-contained HTML, ODT (for Word, LibreOffice, and others), or print to PDF. HTML and PDF export can be fully themed including custom themes.

  Markdown compatibility levels let you target basic (CommonMark), GitHub-flavored, or advanced syntax — with soft editor warnings when your document uses features outside the chosen level.
grade: stable
confinement: strict

apps:
  markdown-viewditor:
    command: usr/bin/MarkdownViewditor
    extensions: [gnome]
    plugs: [home, network, audio-playback, desktop, wayland, x11, opengl]

parts:
  markdown-viewditor:
    plugin: nil
    source: .
    override-build: |
      mkdir -p deb-extract
      ar -x src-tauri/target/release/bundle/deb/*.deb --output deb-extract
      tar -C deb-extract -xf deb-extract/data.tar.gz
      cp -r deb-extract/usr $SNAPCRAFT_PART_INSTALL/
