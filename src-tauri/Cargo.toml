[package]
name = "markdown-viewditor"
authors = ["Paw Hermansen <ai@pawhermansen.dk>"]
version = "1.4.5"
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tauri-plugin-opener = "2.5.4"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
mime_guess = "2"
percent-encoding = "2"
base64 = "0.22"

# SVG rasterization for ODT export. WebKitGTK on Linux refuses to decode
# SVG data URIs through the image element, so we fall back to a pure-Rust
# resvg pipeline. Default features (text + filter + pattern) are kept so
# the rasterizer matches the browser's fidelity on every SVG construct.
# Only linked into Linux bundles — Windows/macOS continue using the
# WebView's native SVG-as-image support via the JS-only Image fallback.
[target.'cfg(target_os = "linux")'.dependencies]
resvg = "0.48"
usvg = "0.48"
tiny-skia = "0.12"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-web-kit = "0.3"
objc2-foundation = "0.3"
block2 = "0.6"

[dev-dependencies]
tempfile = "3"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt"] }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
panic = "abort"
strip = true
